<svg
    preserveAspectRatio="xMidYMax slice"
    viewBox="0 0 1000 1000"
    xmlns="http://www.w3.org/2000/svg"
    class="modern-skyline"
>
    <defs>
        <linearGradient id="grid-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#1a6570" stop-opacity="0" />
            <stop offset="50%" stop-color="#1a6570" stop-opacity="1" />
            <stop offset="100%" stop-color="#1a6570" stop-opacity="0" />
        </linearGradient>

        <linearGradient id="building-fill" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1a6570" stop-opacity="0.01" />
            <stop offset="100%" stop-color="#1a6570" stop-opacity="0.12" />
        </linearGradient>

        <linearGradient id="accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#284adf" stop-opacity="0" />
            <stop offset="50%" stop-color="#284adf" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#60d8d9" stop-opacity="1" />
        </linearGradient>

        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <style>
            @keyframes dashAnim {
            to { stroke-dashoffset: -40; }
            }
            @keyframes pulseAnim {
            0% { r: 2px; opacity: 1; }
            50% { r: 3.5px; opacity: 0.4; }
            100% { r: 2px; opacity: 1; }
            }
            .grid-line {
            stroke: url(#grid-grad);
            stroke-dasharray: 4 6;
            animation: dashAnim 30s linear infinite;
            }
            .pulse-node {
            animation: pulseAnim 3s infinite ease-in-out;
            transform-origin: center;
            }
            .pulse-delay {
            animation-delay: 1.5s;
            }
        </style>
    </defs>

    <g fill="none" stroke-width="0.5" opacity="0.3">
        <line x1="0" x2="1000" y1="900" y2="900" class="grid-line"></line>
        <line x1="0" x2="1000" y1="800" y2="800" class="grid-line"></line>
        <line x1="0" x2="1000" y1="700" y2="700" class="grid-line"></line>
        <line x1="0" x2="1000" y1="600" y2="600" class="grid-line"></line>
        <line x1="0" x2="1000" y1="500" y2="500" class="grid-line"></line>
        <line x1="0" x2="1000" y1="400" y2="400" class="grid-line"></line>
    </g>

    <g fill="url(#building-fill)" opacity="0.4" stroke="#1a6570" stroke-width="0.3">
        <path d="M50 900 V500 H200 V350 H350 V600 H500 V400 H700 V900 Z"></path>
    </g>

    <g fill="url(#building-fill)" opacity="0.9" stroke="#1a6570" stroke-width="0.8">
        <path d="M100 900 V400 H300 V200 H450 V500 H600 V300 H800 V900 Z"></path>
        <path d="M150 900 V450 H250 V900 Z"></path>
        <path d="M350 900 V250 H400 V900 Z"></path>
        <path d="M650 900 V350 H750 V900 Z"></path>
    </g>

    <g fill="none" opacity="0.3" stroke="#1a6570" stroke-width="0.8" stroke-dasharray="2 4">
        <line x1="200" x2="200" y1="900" y2="450"></line>
        <line x1="700" x2="700" y1="900" y2="350"></line>
        <line x1="300" x2="300" y1="900" y2="200"></line>
    </g>

    <g fill="none" stroke="url(#accent-grad)" stroke-width="1.2" filter="url(#glow)">
        <path d="M0 850 Q 400 800, 1000 650"></path>
        <path d="M0 750 Q 600 700, 1000 550" opacity="0.6"></path>
        <path d="M0 950 L 1000 850" opacity="0.3" stroke-width="0.5"></path>
    </g>

    <g fill="#1a6570">
        <circle cx="300" cy="200" r="2.5" class="pulse-node"></circle>
        <circle cx="450" cy="200" r="2.5" class="pulse-node pulse-delay"></circle>
        <circle cx="600" cy="300" r="2.5" class="pulse-node"></circle>
        <circle cx="800" cy="300" r="2.5" class="pulse-node pulse-delay"></circle>

        <circle cx="300" cy="200" r="8" fill="#60d8d9" opacity="0.15" filter="url(#glow)"></circle>
        <circle cx="600" cy="300" r="8" fill="#60d8d9" opacity="0.15" filter="url(#glow)"></circle>
    </g>

    <g fill="#284adf" opacity="0.8">
        <circle cx="400" cy="740" r="2" class="pulse-node" filter="url(#glow)"></circle>
        <circle cx="700" cy="625" r="2" class="pulse-node pulse-delay" filter="url(#glow)"></circle>
    </g>
</svg>