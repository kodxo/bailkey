<!doctype html>
<html class="light" lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>BailKey - Loading</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Manrope:wght@500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Tailwind Config -->
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              surface: "#f5fafa",
              "tertiary-fixed-dim": "#ffb691",
              "on-surface": "#171d1d",
              "inverse-on-surface": "#ecf2f1",
              "on-tertiary-fixed": "#341100",
              card: "oklch(1 0 0)",
              "surface-dim": "#d6dbda",
              outline: "#6d7a79",
              "on-tertiary-fixed-variant": "#763306",
              "surface-container-low": "#eff5f4",
              "surface-container-high": "#e4e9e8",
              "on-primary-fixed-variant": "#004f50",
              "primary-fixed-dim": "#60d8d9",
              primary: "oklch(0.511 0.096 186.391)",
              "on-primary": "#ffffff",
              "on-secondary": "#ffffff",
              "on-primary-container": "#003e3f",
              "surface-container-highest": "#dee4e3",
              "tertiary-container": "#e58957",
              "on-secondary-fixed-variant": "#434749",
              "on-tertiary": "#ffffff",
              "tertiary-fixed": "#ffdbcb",
              "on-secondary-container": "#5f6365",
              "primary-foreground": "oklch(0.984 0.014 180.72)",
              "on-tertiary-container": "#602600",
              "inverse-surface": "#2c3131",
              border: "oklch(0.925 0.005 214.3)",
              "error-container": "#ffdad6",
              "surface-variant": "#dee4e3",
              "on-primary-fixed": "#002020",
              "accent-foreground": "oklch(0.218 0.008 223.9)",
              foreground: "oklch(0.148 0.004 228.8)",
              secondary: "oklch(0.967 0.001 286.375)",
              "glass-border": "rgba(255, 255, 255, 0.6)",
              muted: "oklch(0.963 0.002 197.1)",
              "secondary-fixed": "#e0e3e5",
              accent: "oklch(0.963 0.002 197.1)",
              "on-secondary-fixed": "#181c1e",
              background: "oklch(1 0 0)",
              "primary-container": "#2eb1b2",
              "on-surface-variant": "#3d4949",
              "surface-tint": "#00696a",
              "surface-container": "#eaefee",
              "secondary-foreground": "oklch(0.21 0.006 285.885)",
              "secondary-container": "#dde0e2",
              ring: "oklch(0.723 0.014 214.4)",
              "on-error-container": "#93000a",
              tertiary: "#94491d",
              "secondary-fixed-dim": "#c4c7c9",
              "primary-fixed": "#7ff5f5",
              "outline-variant": "#bcc9c9",
              error: "#ba1a1a",
              "surface-bright": "#f5fafa",
              destructive: "oklch(0.577 0.245 27.325)",
              "surface-container-lowest": "#ffffff",
              "inverse-primary": "#60d8d9",
              "on-background": "#171d1d",
              "on-error": "#ffffff",
              "muted-foreground": "oklch(0.56 0.021 213.5)",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              lg: "2.5rem",
              md: "1.5rem",
              margin: "2rem",
              base: "0.25rem",
              xl: "4rem",
              sm: "1rem",
              gutter: "1.5rem",
              xs: "0.5rem",
            },
            fontFamily: {
              "label-caps": ["Inter"],
              h3: ["Manrope"],
              display: ["Manrope"],
              h2: ["Manrope"],
              "body-lg": ["Inter"],
              "body-md": ["Inter"],
              h1: ["Manrope"],
            },
            fontSize: {
              "label-caps": [
                "12px",
                {
                  lineHeight: "1.0",
                  letterSpacing: "0.05em",
                  fontWeight: "600",
                },
              ],
              h3: ["20px", { lineHeight: "1.4", fontWeight: "500" }],
              display: [
                "48px",
                {
                  lineHeight: "1.1",
                  letterSpacing: "-0.02em",
                  fontWeight: "700",
                },
              ],
              h2: ["24px", { lineHeight: "1.3", fontWeight: "600" }],
              "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }],
              "body-md": ["16px", { lineHeight: "1.5", fontWeight: "400" }],
              h1: [
                "32px",
                {
                  lineHeight: "1.2",
                  letterSpacing: "-0.01em",
                  fontWeight: "600",
                },
              ],
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 300,
          "GRAD" 0,
          "opsz" 24;
      }
       @keyframes translateX {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(300%);
        }
      }
      /* Custom Keyframe Animations for CSS-only loading state */
      @keyframes drawLine1 {
        0% {
          height: 0;
        }
        20% {
          height: 48px;
        }
        100% {
          height: 48px;
        }
      }
      @keyframes drawLine2 {
        0% {
          height: 0;
        }
        20% {
          height: 0;
        }
        40% {
          height: 72px;
        }
        100% {
          height: 72px;
        }
      }
      @keyframes drawLine3 {
        0% {
          height: 0;
        }
        40% {
          height: 0;
        }
        60% {
          height: 32px;
        }
        100% {
          height: 32px;
        }
      }
      @keyframes drawLine4 {
        0% {
          height: 0;
        }
        60% {
          height: 0;
        }
        80% {
          height: 56px;
        }
        100% {
          height: 56px;
        }
      }
      @keyframes drawLine5 {
        0% {
          height: 0;
        }
        80% {
          height: 0;
        }
        100% {
          height: 40px;
        }
      }

      .building-line-1 {
        animation: drawLine1 2.5s infinite ease-in-out;
      }
      .building-line-2 {
        animation: drawLine2 2.5s infinite ease-in-out;
      }
      .building-line-3 {
        animation: drawLine3 2.5s infinite ease-in-out;
      }
      .building-line-4 {
        animation: drawLine4 2.5s infinite ease-in-out;
      }
      .building-line-5 {
        animation: drawLine5 2.5s infinite ease-in-out;
      }

      @keyframes pulse-soft {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.8;
          transform: scale(0.98);
        }
      }
      .animate-pulse-soft {
        animation: pulse-soft 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
    </style>
  </head>
  <body
    class="bg-surface text-on-surface h-screen w-screen overflow-hidden flex flex-col items-center justify-center selection:bg-primary/20"
  >
    <!-- Loading Container -->
    <main
      class="relative flex flex-col items-center justify-center w-full max-w-md mx-auto p-gutter z-10 animate-pulse-soft"
    >
      <!-- Architectural Geometric Indicator -->
      <div
        class="relative w-32 h-32 mb-xl flex items-end justify-center gap-[4px] border-b-2 border-surface-dim pb-1"
      >
        <!-- Geometric "Building" Bars -->
        <div
          class="w-[12px] bg-primary rounded-t-sm opacity-60 building-line-1"
          style="height: 48px"
        ></div>
        <div
          class="w-[12px] bg-primary rounded-t-sm opacity-80 building-line-2"
          style="height: 72px"
        ></div>
        <div
          class="w-[12px] bg-primary rounded-t-sm opacity-40 building-line-3"
          style="height: 32px"
        ></div>
        <div
          class="w-[12px] bg-primary rounded-t-sm opacity-90 building-line-4"
          style="height: 56px"
        ></div>
        <div
          class="w-[12px] bg-primary rounded-t-sm opacity-50 building-line-5"
          style="height: 40px"
        ></div>
        <!-- Structural Grid Overlay Effect (Glassmorphism hint) -->
        <div
          class="absolute inset-0 bg-gradient-to-t from-surface via-transparent to-transparent opacity-20 pointer-events-none"
        ></div>
      </div>
      <!-- Typography -->
      <div class="text-center space-y-md">
        <h1 class="font-h2 text-h2 text-primary tracking-tight">
          <img
            src="{{DATA:IMAGE:IMAGE_3}}"
            alt="BailKey Logo"
            class="h-12 w-auto mx-auto"
          />
        </h1>
        <p
          class="font-body-lg text-body-lg text-on-surface-variant font-light tracking-wide"
        >
          Initialisation de votre espace...
        </p>
      </div>
      <!-- Progress Track (Subtle) -->
      <div
        class="w-48 h-[2px] bg-surface-variant rounded-full mt-lg overflow-hidden relative"
      >
        <div
          class="absolute top-0 left-0 h-full bg-primary rounded-full w-1/3 animate-[translateX_2s_infinite_linear]"
        ></div>
      </div>
    </main>
    <!-- Background Structural Elements (Ambient Depth) -->
    <div
      class="fixed inset-0 pointer-events-none z-0 overflow-hidden flex items-center justify-center"
    >
      <!-- Diffused light circle mimicking the primary brand color -->
      <div
        class="absolute w-[600px] h-[600px] bg-primary rounded-full mix-blend-multiply filter blur-[120px] opacity-5"
      ></div>
      <!-- Geometric structural lines in background -->
      <svg
        class="absolute inset-0 w-full h-full opacity-[0.03]"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <pattern
            height="40"
            id="grid"
            patternUnits="userSpaceOnUse"
            width="40"
          >
            <path
              d="M 40 0 L 0 0 0 40"
              fill="none"
              stroke="currentColor"
              stroke-width="1"
            ></path>
          </pattern>
        </defs>
        <rect
          class="text-on-surface"
          fill="url(#grid)"
          height="100%"
          width="100%"
        ></rect>
      </svg>
    </div>
    <style>
     
    </style>
  </body>
</html>
